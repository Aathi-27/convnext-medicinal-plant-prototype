name: Package attributed experimental dataset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'Aathi-27/convnext-medicinal-plant-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/package_dataset.py
      - name: Publish explicitly experimental snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dataset-v0.3-experimental >/tmp/existing-release.txt 2>&1; then
            cat /tmp/existing-release.txt
            echo 'Existing release left unchanged; verify before any replacement.'
            exit 1
          fi
          gh release create dataset-v0.3-experimental release-assets/* --prerelease --title 'Dataset v0.3 - experimental community labels' --notes-file data/dataset-v0.3/DATASET_CARD.md
