          PYCODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt pytest httpx python-multipart
      - run: python -m pytest -q && python -m compileall -q app scripts training
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci --ignore-scripts && npm run build
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/commons-source.yml
          git add README.md docs scripts .github/workflows/dataset-release.yml
          git commit -m 'Record all-ten-class source-shift failure and dataset release preparation'
          git push
      - name: Package verified attributed690-image snapshot
        run: python scripts/package_dataset.py
      - name: Publish explicitly experimental v0.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dataset-v0.4-experimental; then
            echo 'Existing release left unchanged.'
            exit 1
          fi
          gh release create dataset-v0.4-experimental release-assets/* --prerelease --title 'Dataset v0.4 - experimental690image development snapshot' --notes-file data/dataset-v0.4/DATASET_CARD.md
