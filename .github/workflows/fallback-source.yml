      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt pytest httpx python-multipart
      - run: python -m pytest -q && python -m compileall -q app scripts training
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci --ignore-scripts && npm run build
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/fallback-source.yml
          git add README.md app/main.py app/external.py web/src/main.tsx web/src/style.css tests/test_external.py deploy/fallback-compose.yaml docs/external-fallback.md
          git commit -m 'Add consented optional photo check with shared possible-match layout'
          git push
