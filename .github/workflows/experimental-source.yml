      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt pytest httpx python-multipart
      - run: python -m pytest -q && python -m compileall -q app scripts training
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci --ignore-scripts && npm run build
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/experimental-source.yml
          git add README.md app web/src/main.tsx scripts/install_model.py tests docs
          git commit -m 'Add guarded experimental prediction-to-knowledge flow'
          git push
