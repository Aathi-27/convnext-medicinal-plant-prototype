      - name: Check source and frontend
        run: |
          python -m compileall -q app scripts training
          cd web && npm ci --ignore-scripts && npm run build
      - name: Commit project source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/.github/workflows/import-source.yml
          git add README.md app data docs scripts tests training web .gitignore .dockerignore Dockerfile render.yaml requirements.txt requirements-train.txt artifacts/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Document small internal pilot and partial source-checked knowledge'
            git push
          fi
